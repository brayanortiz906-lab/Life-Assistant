<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienestar – Mi Asistente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/animations.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark">
  <header class="top-bar">
    <a href="index.html" class="logo flex items-center gap-2">
      <svg class="h-5 w-5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Mi Asistente
    </a>
    <nav class="nav">
      <a href="agenda.html">Agenda</a>
      <a href="estudios.html">Estudios</a>
      <a href="finanzas.html">Finanzas</a>
      <a href="bienestar.html" class="text-accent">Bienestar</a>
    </nav>
  </header>

  <main class="canvas">
    <header class="mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 flex items-center justify-center">
              <i data-lucide="heart-pulse" class="w-5 h-5"></i>
            </span>
            Bienestar & Salud
          </h1>
          <p class="text-sm text-secondary mt-2">Seguimiento completo de tu salud física y mental</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="pill bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs">7 días</span>
        </div>
      </div>
    </header>

    <!-- Métricas Principales 2x3 Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
      <div id="water-detail"></div>
      <div id="sleep-detail"></div>
      <div id="exercise-detail"></div>
      <div id="steps-detail"></div>
      <div id="meditation-detail"></div>
      <div id="nutrition-detail"></div>
    </div>

    <!-- Acciones Rápidas -->
    <div class="panel mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold flex items-center gap-2">
          <i data-lucide="zap" class="w-4 h-4 text-accent"></i>
          Acciones Rápidas
        </h2>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button id="add-water-btn" class="btn flex items-center justify-center gap-2 py-3 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500/20">
          <span class="text-lg">💧</span>
          +250ml Agua
        </button>
        <button id="add-sleep-btn" class="btn flex items-center justify-center gap-2 py-3 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hover:bg-indigo-500/20">
          <span class="text-lg">😴</span>
          +30min Sueño
        </button>
        <button id="log-exercise-btn" class="btn flex items-center justify-center gap-2 py-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20">
          <span class="text-lg">🏃</span>
          +10min Ejercicio
        </button>
        <button id="quick-med-btn" class="btn flex items-center justify-center gap-2 py-3 bg-purple-500/10 text-purple-400 border border-purple-500/20 hover:bg-purple-500/20">
          <span class="text-lg">🧘</span>
          +5min Meditación
        </button>
      </div>
    </div>

    <!-- Gráfico de Peso y Rachas -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <!-- Gráfico de Peso -->
      <div class="panel">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold flex items-center gap-2">
            <i data-lucide="trending-up" class="w-4 h-4 text-accent"></i>
            Seguimiento de Peso
          </h2>
          <span class="text-xs text-secondary" id="weight-current">— kg</span>
        </div>
        <canvas id="weight-chart" class="w-full h-48"></canvas>
        <div class="flex justify-between items-center mt-3 text-xs text-secondary">
          <span>Últimos 7 días</span>
          <span>Tendencia estable</span>
        </div>
      </div>

      <!-- Rachas -->
      <div class="panel">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold flex items-center gap-2">
            <i data-lucide="flame" class="w-4 h-4 text-orange-400"></i>
            Rachas Activas
          </h2>
        </div>
        <div class="grid grid-cols-2 gap-3" id="streaks-grid"></div>
      </div>
    </div>

    <!-- Comparativa Semanal -->
    <div class="panel">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold flex items-center gap-2">
          <i data-lucide="bar-chart-3" class="w-4 h-4 text-accent"></i>
          Comparativa Semanal
        </h2>
        <span class="text-xs text-secondary">vs. semana anterior</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3" id="weekly-comparison"></div>
    </div>
  </main>

  <script src="scripts/bienestar-v2.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
